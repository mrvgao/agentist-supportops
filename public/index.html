<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportOps · 客服工作台</title>
<style>
:root{color-scheme:light;--ink:#15252e;--muted:#51636d;--line:#d6dfe3;--blue:#234bc4}*{box-sizing:border-box}body{margin:0;background:#f7f9fa;color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{background:#15252e;color:white;padding:22px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center}header strong{font-size:22px}header span{font-size:13px;color:#c3d1d9}main{max-width:1120px;margin:48px auto;padding:0 24px}h1{font-size:36px;line-height:1.3;margin:0 0 12px}h2{font-size:20px;margin:0 0 20px}.intro{color:var(--muted);max-width:680px;margin-bottom:36px}.layout{display:grid;grid-template-columns:340px 1fr;gap:40px}section{min-width:0}.panel{background:white;border:1px solid var(--line);padding:24px}label{display:block;font-size:14px;margin-top:16px}input,textarea{width:100%;border:1px solid #8799a4;background:#fff;padding:12px;font:inherit;border-radius:4px}textarea{min-height:155px;resize:vertical}button{font:inherit;cursor:pointer;border:0;border-radius:4px;background:var(--blue);color:#fff;padding:10px 18px;margin-top:18px}button:hover{background:#183ba6}button:disabled{opacity:.55;cursor:wait}.secondary{background:#e7edf1;color:var(--ink);margin-left:8px}.secondary:hover{background:#d4dfe7}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #5178ec;outline-offset:3px}.ticket{padding:22px 0;border-bottom:1px solid var(--line)}.ticket:first-child{padding-top:0}.ticket p{white-space:pre-wrap;overflow-wrap:anywhere}.meta{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}.status{font-weight:600;color:#234bc4}.reply{background:#edf2f5;padding:16px;margin-top:14px}.reply p{margin:6px 0}.source{font-size:12px;color:var(--muted)}.empty{padding:38px 24px;border:1px dashed #9aadb7;color:var(--muted)}#notice{min-height:28px;color:#9b3520;margin:18px 0}footer{font-size:13px;color:var(--muted);margin-top:38px}a{color:var(--blue)}[hidden]{display:none!important}::selection{background:#cbd8fb}@media(max-width:720px){main{margin-top:28px}.layout{grid-template-columns:1fr;gap:28px}h1{font-size:28px}header span{display:none}}
</style></head><body><header><strong>SupportOps</strong><span>Agentist · 现代 Agent 技术栈课堂案例</span></header><main><h1>每张工单，都有下一步。</h1><p class="intro">提交问题后，Agent 会查阅帮助文档与订阅记录，准备回复草稿。涉及退款或无法确认的信息，将交由人工处理。</p><div class="layout"><section><div class="panel" id="auth"><h2>登录你的工作区</h2><form id="login"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button id="login-button">登录</button><button type="button" class="secondary" id="signup">注册</button></form></div><div class="panel" id="compose" hidden><h2>提交客服工单</h2><form id="ticket-form"><label for="body">遇到了什么问题？</label><textarea id="body" maxlength="4000" required placeholder="例如：取消订阅后，我仍收到一封扣费通知。"></textarea><button id="submit-button">提交给 Agent</button></form><button class="secondary" id="logout">退出登录</button></div><p id="notice" role="status" aria-live="polite"></p></section><section aria-labelledby="list-title"><h2 id="list-title">处理记录</h2><div id="tickets" class="empty">登录后，这里会显示你的工单和处理进度。</div></section></div><footer>回复仅保存为草稿，不会自动发送或执行退款。演示数据请勿填写真实支付信息。</footer></main>
<script type="module">
const $=id=>document.getElementById(id);let config,session=null,refreshing=false;
const labels={queued:'等待处理',running:'Agent 处理中',completed:'处理完成',failed:'处理失败',blocked:'预算不足',draft:'待审核草稿',human_review:'需要人工处理'};
const notice=text=>{$('notice').textContent=text;};
function node(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e;}
async function auth(path,body){const r=await fetch(config.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:config.anonKey,'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.msg||data.error_description||'登录失败，请检查邮箱和密码');return data;}
function show(){ $('auth').hidden=!!session;$('compose').hidden=!session;if(!session){$('tickets').className='empty';$('tickets').textContent='登录后，这里会显示你的工单和处理进度。';}}
async function request(method='GET',body){if(session?.expires_at && session.expires_at*1000<Date.now()+30000){session=await auth('token?grant_type=refresh_token',{refresh_token:session.refresh_token});}const r=await fetch('/api/tickets',{method,headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error);return data;}
async function refresh(){if(!session||refreshing)return;refreshing=true;try{const data=await request();$('tickets').replaceChildren();$('tickets').className=data.tickets.length?'':'empty';if(!data.tickets.length)$('tickets').textContent='还没有工单。提交第一个问题，观察 Agent 的处理过程。';for(const t of data.tickets){const el=node('article','','ticket');const job=t.jobs?.[0]||t.jobs||{};const meta=node('div','','meta');meta.append(node('span',labels[job.status]||'等待处理','status'),node('time',new Date(t.created_at).toLocaleString('zh-CN')));el.append(meta,node('p',t.body));const reply=t.replies?.[0]||(!Array.isArray(t.replies)&&t.replies);if(reply){const box=node('div','','reply');box.append(node('strong',labels[reply.status]),node('p',reply.text),node('div','依据：'+(reply.citations?.join(' · ')||'待人工核实'),'source'));el.append(box);}if(job.status==='failed'||job.status==='blocked')el.append(node('p',job.status==='blocked'?'当前工作区预算不足，请联系课程管理员。':'已达到重试上限，请联系课程管理员查看任务状态。','source'));$('tickets').append(el);}}catch(e){notice(e.message);}finally{refreshing=false;}}
async function sign(signup=false){notice('');if(!$('login').reportValidity())return;$('login-button').disabled=$('signup').disabled=true;try{const data=await auth(signup?'signup':'token?grant_type=password',{email:$('email').value,password:$('password').value});if(data.access_token){session=data;show();await refresh();}else notice('注册成功，请查收确认邮件后登录。');}catch(e){notice(e.message);}finally{$('login-button').disabled=$('signup').disabled=false;}}
$('login').onsubmit=e=>{e.preventDefault();sign();};$('signup').onclick=()=>sign(true);
$('ticket-form').onsubmit=async e=>{e.preventDefault();$('submit-button').disabled=true;try{await request('POST',{body:$('body').value});$('body').value='';notice('工单已提交。处理进度会自动更新。');await refresh();}catch(e){notice(e.message);}finally{$('submit-button').disabled=false;}};
$('logout').onclick=()=>{session=null;show();notice('已退出登录');};
try{const r=await fetch('/api/config');config=await r.json();if(!config.url||!config.anonKey)throw Error('尚未连接数据库，请先完成部署配置。');}catch(e){notice(e.message);$('login-button').disabled=$('signup').disabled=true;}
setInterval(refresh,4000);
</script></body></html>
